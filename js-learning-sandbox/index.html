<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wirtualny Portfel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Wirtualny Portfel</h1>
        
        <div class="balance-card">
            <span class="balance-label">Całkowite saldo:</span>
            <h2 class="balance-amount"><span id="saldo-widok">100</span> PLN</h2>
        </div>

    <div class="statystyki-kontener">
        <div class="statystyka-box">
            <p>Wpływy (30 dni)</p>
            <h3 id="wplaty-30dni">+0 PLN</h3>
        </div>
        <div class="statystyka-box">
            <p>Wydatki (30 dni)</p>
            <h3 id="wydatki-30dni">-0 PLN</h3>
        </div>
    </div>
        <div class="form-row">
            <input type="number" id="kwota-input" placeholder="Wpisz Kwote">
            <select id="kategoria-select">
                <option value="" selected disabled>Wybierz Kategorię</option>
                <option value="praca">💼 Praca/Wynagrodzenie</option>
                <option value="jedzenie">🍔 Jedzenie</option>
                <option value="rozrywka">🎬 Rozrywka</option>
                <option value="rachunki">🏠 Rachunki</option>
                <option value="transport">🚗 Transport</option>
                <option value="oszczednosci">💰 Oszczędności</option>
                <option value="inne">📦 Inne</option>
            </select>
        </div>

        <div class="przyciski">
            <button onclick="obslugaWplaty()">Wplac</button>
            <button onclick="obslugaWydatku()">Wydaj</button>
        </div>

        <h3>Historia transakcji:</h3>
        <ul id="historia-transakcji"></ul>
        <button id="wiecej-btn" onclick="pokazWiecej()">Zobacz więcej</button>
        <button class="reset-btn" onclick="resetujDane()">Wyczyść konto</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
